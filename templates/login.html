<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | Student Information System</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><h1>Student Information System</h1></header><main class="login"><h2>Sign in</h2>
{% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">
<label>Username<input name="username" autocomplete="username" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<div class="buttons"><button type="submit">Sign in</button></div></form></main></body></html>
