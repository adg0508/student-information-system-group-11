services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sis
      POSTGRES_USER: sis
      POSTGRES_PASSWORD: local-demo
    volumes:
      - records:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-sis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sis -d sis"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://sis:local-demo@db:5432/sis
    ports:
      - "127.0.0.1:5081:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  records:
